name: Build APK (debug)

# APK debug untuk uji coba cepat. Tanda tangannya berubah di setiap build,
# jadi tidak bisa menimpa versi lama. Untuk dibagikan, pakai workflow "Release APK".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'package-lock.json') }}
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx cap add android
      - name: Izin notifikasi Android
        run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Ikon dan splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Nomor versi
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.${{ github.run_number }}-debug\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: snack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
