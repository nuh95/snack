<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesanan Snack</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17231d;--mut:#5d6b63;--line:#e1e7e2;--pri:#0f6b4f;--pri-ink:#fff;--acc:#b97c05;--acc-bg:#fdf1d3;--bad:#b4381a;--bad-bg:#fbe3dc;--ok-bg:#dcf1e6;--bar:#e8a317;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1613;--card:#17211c;--ink:#e8efea;--mut:#9db0a5;--line:#263229;--pri:#3fbf93;--pri-ink:#06251a;--acc:#f0b43a;--acc-bg:#3a2d0c;--bad:#f08a6c;--bad-bg:#3b1a11;--ok-bg:#123225;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1613;--card:#17211c;--ink:#e8efea;--mut:#9db0a5;--line:#263229;--pri:#3fbf93;--pri-ink:#06251a;--acc:#f0b43a;--acc-bg:#3a2d0c;--bad:#f08a6c;--bad-bg:#3b1a11;--ok-bg:#123225;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:480px;margin:0 auto;padding-bottom:110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:20px;letter-spacing:-.2px}
header small{color:var(--mut);display:block;font-size:12.5px}
main{padding:0 16px}
h2{font-size:13px;color:var(--mut);font-weight:600;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mut);font-size:13px}
.big{font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--bar)}
.bar i.full{background:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tiles .card{margin:0}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.c-w{background:var(--acc-bg);color:var(--acc)}.c-g{background:var(--ok-bg);color:var(--pri)}.c-s{background:var(--pri);color:var(--pri-ink)}.c-m{background:var(--line);color:var(--mut)}.c-b{background:var(--bad-bg);color:var(--bad)}
.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.item:active{background:var(--bg)}
.item b{font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.f{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 13px;cursor:pointer}
.f.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px;width:100%;background:var(--pri);color:var(--pri-ink);cursor:pointer;margin-top:12px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--bad-bg);color:var(--bad)}
a.btn{display:block;text-align:center;text-decoration:none}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:6}
nav button{font:inherit;font-size:11px;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
nav button.on{color:var(--pri);font-weight:600}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(env(safe-area-inset-bottom,0px) + 78px);width:56px;height:56px;border-radius:18px;border:0;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;cursor:pointer;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab svg{width:26px;height:26px}
#sh .bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#sh .sd{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);z-index:21}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.step span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;gap:6px}
.seg button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.pq{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;text-align:right;letter-spacing:-1px}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--pri-ink);cursor:pointer;display:grid;place-items:center;padding:0}
.ck.on{background:var(--pri);border-color:var(--pri)}
.ck svg{width:16px;height:16px;stroke-width:3}
.done .pq,.done b{opacity:.45;text-decoration:line-through}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0 0;color:var(--ink)}.chk input{width:20px;height:20px;padding:0}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 146px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:30;display:none}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.hb{display:flex;align-items:end;gap:6px;height:90px;margin:8px 0 4px}
.hb div{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--mut)}
.hb i{display:block;width:100%;background:var(--bar);border-radius:5px 5px 0 0;min-height:2px}
.hb .t i{background:var(--pri)}
.tap{cursor:pointer}
.step input{width:58px;text-align:center;padding:8px 4px}
.rs{margin:6px 0 0;padding:9px 12px}
.sec{margin-top:26px}
</style>
</head>
<body>
<div id="app">
<header><div><b id="ttl">Beranda</b><small id="sub"></small></div><span class="chip c-g" id="cap"></span></header>
<main id="v"></main>
</div>
<button class="fab" data-a="fab" aria-label="Tambah"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nv"></nav>
<div id="sh" hidden></div>
<input type="file" id="fl" accept=".json,application/json" hidden>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const add=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fd=s=>{if(s===TODAY)return'Hari ini';if(s===add(TODAY,1))return'Besok';const d=new Date(s+'T00:00:00');return HR[d.getDay()]+', '+d.getDate()+' '+BL[d.getMonth()]};
let CAP=300,ONGKIR=10000,MINH=1;const ST=['Baru','Dikonfirmasi','Terkunci','Diproduksi','Siap','Selesai'];
const CH={Baru:'c-w',Dikonfirmasi:'c-w',Terkunci:'c-g',Diproduksi:'c-g',Siap:'c-s',Selesai:'c-m',Dibatalkan:'c-b'};
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',pot:'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM8 6c0-2 2-2 2-4M14 6c0-2 2-2 2-4',users:'M16 8a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM4 21a8 8 0 0 1 16 0',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',check:'M5 12l5 5 9-10',money:'M12 2v20M17 6.5H9.75a3.25 3.25 0 0 0 0 6.5h4.5a3.25 3.25 0 0 1 0 6.5H6'};
const ic=n=>'<svg viewBox="0 0 24 24"><path d="'+IC[n]+'"/></svg>';
const blank=()=>({prods:[],custs:[],orders:[],done:{},seq:0,set:{cap:300,ongkir:10000,minh:1}});
const seed=()=>{const P=[['p1','Nastar','Toples',85000],['p2','Kastengel','Toples',95000],['p3','Risoles isi 10','Box',35000],['p4','Pastel isi 10','Box',30000],['p5','Keripik pisang','Pack',25000],['p6','Brownies kering','Pack',45000]].map(x=>({id:x[0],nama:x[1],sat:x[2],harga:x[3]}));
const C=[['c1','Bu Ratna','6281234567801','Jl. Melati 12'],['c2','Kantor Maju Jaya','6281234567802','Jl. Sudirman 45'],['c3','Siti Aminah','6281234567803','Perum Griya Asri B7'],['c4','Toko Berkah','6281234567804','Pasar Baru Los 3'],['c5','Ayu Lestari','6281234567805','Jl. Kenanga 5']].map(x=>({id:x[0],nama:x[1],wa:x[2],alamat:x[3]}));
const O=[[1,'c1',0,'10:00','Ambil',[['p1',4],['p2',2]],150000,150000,'Terkunci'],[2,'c2',0,'13:00','Antar',[['p3',20],['p4',20]],0,0,'Dikonfirmasi'],[3,'c3',0,'16:30','Ambil',[['p6',6]],100000,100000,'Diproduksi'],[4,'c4',1,'09:00','Antar',[['p5',40],['p3',10]],500000,500000,'Terkunci'],[5,'c5',2,'11:00','Ambil',[['p1',6]],0,0,'Baru'],[6,'c1',2,'15:00','Ambil',[['p2',3],['p6',3]],200000,200000,'Terkunci'],[7,'c2',3,'10:00','Antar',[['p4',30],['p3',30]],800000,800000,'Terkunci'],[8,'c3',-1,'14:00','Ambil',[['p1',2]],170000,170000,'Selesai'],[9,'c4',-2,'08:00','Antar',[['p5',60]],500000,1510000,'Selesai']].map(x=>({id:'o'+x[0],no:'PO-'+pad(x[0]),c:x[1],tgl:add(TODAY,x[2]),jam:x[3],met:x[4],it:x[5].map(i=>({p:i[0],q:i[1]})),dp:x[6],paid:x[7],st:x[8],n:''}));
O[8].paid=O[8].it.reduce((s,i)=>s+i.q*25000,0)+ONGKIR;
return{prods:P,custs:C,orders:O,done:{},seq:10,set:{cap:300,ongkir:10000,minh:1}}};
let S=null;try{S=JSON.parse(localStorage.getItem('snk1'))}catch(e){}
if(!S||!S.orders)S=blank();
function applySet(){S.set=S.set||{cap:300,ongkir:10000,minh:1};CAP=+S.set.cap>0?+S.set.cap:300;ONGKIR=isFinite(+S.set.ongkir)?+S.set.ongkir:10000;MINH=+S.set.minh>=0?+S.set.minh:1}
applySet();
const persist=()=>{try{localStorage.setItem('snk1',JSON.stringify(S))}catch(e){}};
const save=()=>{S.mod=Date.now();persist();schedSoon()};
const prod=id=>S.prods.find(p=>p.id===id)||{nama:'?',harga:0,sat:''};
const cust=id=>S.custs.find(c=>c.id===id)||{nama:'?',wa:''};
const ord=id=>S.orders.find(o=>o.id===id);
const sub=o=>o.it.reduce((s,i)=>s+i.q*prod(i.p).harga,0);
const tot=o=>sub(o)+(o.met==='Antar'?ONGKIR:0);
const qty=o=>o.it.reduce((s,i)=>s+i.q,0);
const live=o=>o.st!=='Dibatalkan';
const dayQty=(d,skip)=>S.orders.filter(o=>o.tgl===d&&live(o)&&o.id!==skip).reduce((s,o)=>s+qty(o),0);
const piutang=()=>S.orders.filter(live).reduce((s,o)=>s+Math.max(0,tot(o)-o.paid),0);
let TAB='home',Q='',F='Semua',PD=TODAY,DT='cust',NO=null,DQ='',XQ='',XM='nota';
const TITLES={home:'Beranda',pes:'Pesanan',prod:'Produksi',piu:'Piutang',data:'Data',lap:'Laporan'};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function row(o){const c=cust(o.c),lun=o.paid>=tot(o);return'<button class="item" data-a="det" data-id="'+o.id+'"><div class="row"><b>'+esc(c.nama)+'</b><span class="chip '+CH[o.st]+'">'+o.st+'</span></div><div class="mu">'+o.no+' · '+fd(o.tgl)+' '+o.jam+' · '+o.met+'</div><div class="row" style="margin-top:6px"><span>'+rp(tot(o))+'</span><span class="mu">'+(o.st==='Dibatalkan'?'':lun?'Lunas':'Sisa '+rp(tot(o)-o.paid))+'</span></div></button>'}
function home(){const ob=(!S.prods.length||!S.custs.length)?'<div class="card"><b>Mulai di sini</b><div class="mu" style="margin:4px 0">Tambahkan produk dan pelanggan dulu, lalu catat pesanan pertama.</div><button class="btn" data-a="tab" data-t="data">Buka menu Data</button></div>':'';const q=dayQty(TODAY),pct=Math.min(100,q/CAP*100),td=S.orders.filter(o=>o.tgl===TODAY&&live(o)).sort((a,b)=>a.jam<b.jam?-1:1),wt=S.orders.filter(o=>(o.st==='Baru'||o.st==='Dikonfirmasi')&&o.tgl>=TODAY);
return ob+'<div class="card"><div class="mu">Kapasitas produksi hari ini</div><div class="row" style="align-items:baseline"><span class="big">'+q+'<small class="mu" style="font-size:16px;font-weight:400"> / '+CAP+' unit</small></span><span class="mu">'+(q>=CAP?'Penuh':'Sisa '+(CAP-q))+'</span></div><div class="bar"><i class="'+(q>=CAP?'full':'')+'" style="width:'+pct+'%"></i></div></div>'
+'<div class="tiles"><div class="card"><div class="mu">Pesanan hari ini</div><div class="big">'+td.length+'</div></div><div class="card tap" data-a="tab" data-t="piu"><div class="mu">Piutang</div><div class="big" style="font-size:22px;padding-top:8px">'+rp(piutang())+'</div></div></div>'
+'<h2>Jadwal hari ini</h2>'+(td.length?td.map(row).join(''):'<div class="empty">Belum ada pesanan untuk hari ini.</div>')
+(wt.length?'<h2>Belum masuk produksi ('+wt.length+')</h2>'+wt.map(row).join(''):'')}
function listHtml(){const l=S.orders.filter(o=>(F==='Semua'||o.st===F)&&(!Q||(cust(o.c).nama+o.no).toLowerCase().includes(Q.toLowerCase()))).sort((a,b)=>a.tgl===b.tgl?(a.jam<b.jam?-1:1):(a.tgl<b.tgl?-1:1));return l.length?l.map(row).join(''):'<div class="empty">Tidak ada pesanan yang cocok.</div>'}
function pes(){return'<input id="q" placeholder="Cari nama atau nomor pesanan" value="'+esc(Q)+'" style="margin-bottom:10px"><div class="chips">'+['Semua'].concat(ST,['Dibatalkan']).map(s=>'<button class="f'+(F===s?' on':'')+'" data-a="flt" data-v="'+s+'">'+s+'</button>').join('')+'</div><div id="lst">'+listHtml()+'</div>'}
function prodv(){const os=S.orders.filter(o=>o.tgl===PD&&(o.st==='Terkunci'||o.st==='Diproduksi')),wt=S.orders.filter(o=>o.tgl===PD&&(o.st==='Baru'||o.st==='Dikonfirmasi')).length,ag={};
os.forEach(o=>o.it.forEach(i=>ag[i.p]=(ag[i.p]||0)+i.q));
const ks=Object.keys(ag);
return'<div class="row" style="margin-bottom:10px"><button class="f" data-a="pd" data-d="-1" aria-label="Hari sebelumnya">‹</button><b>'+fd(PD)+'</b><button class="f" data-a="pd" data-d="1" aria-label="Hari berikutnya">›</button></div>'
+'<h2>Yang harus dibuat</h2>'+(ks.length?ks.map(k=>{const d=S.done[PD+'|'+k],p=prod(k);return'<div class="card row'+(d?' done':'')+'"><div><b>'+esc(p.nama)+'</b><div class="mu">'+p.sat+'</div></div><div class="row"><span class="pq">'+ag[k]+'</span><button class="ck'+(d?' on':'')+'" data-a="done" data-id="'+k+'" aria-label="Tandai selesai">'+(d?ic('check'):'')+'</button></div></div>'}).join(''):'<div class="empty">Tidak ada produksi untuk tanggal ini.</div>')
+(wt?'<div class="mu" style="margin-top:4px">'+wt+' pesanan belum berstatus Terkunci, belum dihitung.</div>':'')
+(os.length?'<h2>Daftar kemas</h2>'+os.map(o=>'<button class="item" data-a="det" data-id="'+o.id+'"><div class="row"><b>'+esc(cust(o.c).nama)+'</b><span class="mu">'+o.jam+' · '+o.met+'</span></div><div class="mu">'+o.it.map(i=>i.q+' '+esc(prod(i.p).nama)).join(', ')+'</div></button>').join(''):'')}
function dlist(){const cu=DT==='cust',q=DQ.trim().toLowerCase(),nm=(a,b)=>a.nama.localeCompare(b.nama);
if(cu){const l=S.custs.filter(c=>!q||(c.nama+' '+c.wa+' '+(c.alamat||'')).toLowerCase().includes(q)).sort(nm);return l.length?l.map(c=>{const n=S.orders.filter(o=>o.c===c.id).length;return'<button class="item" data-a="ec" data-id="'+c.id+'"><div class="row"><b>'+esc(c.nama)+'</b><span class="mu">'+n+' pesanan</span></div><div class="mu">'+esc(c.alamat||c.wa)+'</div></button>'}).join(''):'<div class="empty">'+(S.custs.length?'Tidak ada pelanggan yang cocok.':'Belum ada pelanggan.')+'</div>'}
const l=S.prods.filter(p=>!q||(p.nama+' '+p.sat).toLowerCase().includes(q)).sort(nm);return l.length?l.map(p=>'<button class="item" data-a="ep" data-id="'+p.id+'"><div class="row"><b>'+esc(p.nama)+'</b><b>'+rp(p.harga)+'</b></div><div class="mu">per '+esc(p.sat.toLowerCase())+'</div></button>').join(''):'<div class="empty">'+(S.prods.length?'Tidak ada produk yang cocok.':'Belum ada produk.')+'</div>'}
function datav(){const cu=DT==='cust';return'<div class="seg" style="margin-bottom:12px"><button class="'+(cu?'on':'')+'" data-a="seg" data-v="cust">Pelanggan</button><button class="'+(cu?'':'on')+'" data-a="seg" data-v="prod">Produk</button></div>'
+'<input id="dq" type="search" placeholder="'+(cu?'Cari nama, WhatsApp, atau alamat':'Cari nama produk')+'" value="'+esc(DQ)+'" autocomplete="off" style="margin-bottom:10px"><div id="dl">'+dlist()+'</div>'
+(cu?'':'<button class="btn" data-a="ep">Tambah produk</button>')+'<h2>Pengaturan</h2><button class="btn alt" data-a="set" style="margin-top:0">Pengaturan, backup, sinkronisasi, update</button>'+(S.orders.length||S.custs.length||S.prods.length?'':'<button class="btn alt" data-a="demo">Muat data contoh</button>')}
const due=o=>Math.max(0,tot(o)-o.paid),unpaid=()=>S.orders.filter(o=>live(o)&&due(o)>0);
function piuCard(o){const c=cust(o.c),w='Halo '+c.nama+', mengingatkan pembayaran pesanan '+o.no+' ('+o.it.map(x=>x.q+' '+prod(x.p).nama).join(', ')+') tanggal '+fd(o.tgl)+'. Total '+rp(tot(o))+', terbayar '+rp(o.paid)+', sisa '+rp(due(o))+'. Terima kasih.';

function notaLines(o){const c=cust(o.c),st=S.set,W=40,lr=(a,b)=>{a=L1(a);b=L1(b);a=a.slice(0,Math.max(1,W-b.length-1));return a+' '.repeat(Math.max(1,W-a.length-b.length))+b},ce=(t,w)=>{t=L1(t).slice(0,w);return ' '.repeat(Math.floor((w-t.length)/2))+t},ln=[],hr='-'.repeat(W);

ln.push({t:hr},{t:lr('TOTAL',rp(t)),b:1},{t:lr('Terbayar',rp(o.paid))},{t:lr('Sisa',rp(sisa)),b:1},{t:''},{t:ce(sisa?'BELUM LUNAS':'LUNAS',W),b:1});

function pdfOf(ln){const W=280,m=22,lh=13,H=Math.max(220,ln.length*lh+2*m);let c='';
ln.forEach((l,i)=>{const y=(H-m-(i+1)*lh+3).toFixed(1);c+='BT /'+(l.b?'F2':'F1')+' '+(l.s||9)+' Tf 1 0 0 1 '+m+' '+y+' Tm ('+L1(l.t).replace(/[\\()]/g,'\\$&')+') Tj ET\n'});

let o='%PDF-1.4\n',of=[];ob.forEach((x,i)=>{of.push(o.length);o+=(i+1)+' 0 obj\n'+x+'\nendobj\n'});const xr=o.length;
