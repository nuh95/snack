<style>

a.btn{display:block;text-align:center;text-decoration:none}

.hb.d{gap:2px}.hb.d div{font-size:10px}

function fbDiff(E){const o=[];for(const k in E)if(FS.snap[k]!==hs(E[k]))o.push([k,0]);for(const k in FS.snap)if(!(k in E))o.push([k,1]);return o}
function fbQueue(){if(!FBM())return;clearTimeout(FBP);FBP=setTimeout(fbPush,800)}
async function fbPush(){
  if(!FBM()||!FBReady)return;
  if(FBBusy){FBDirty=1;return}
  FBBusy=1;FBDirty=0;let ok=true;
  try{
    const E=fbEnts(),ch=fbDiff(E);
    for(let i=0;i<ch.length;i+=200){
      const part=ch.slice(i,i+200),body={};
      part.forEach(c=>{body[c[0]]=c[1]?{m:{'.sv':'timestamp'},x:1}:{m:{'.sv':'timestamp'},d:E[c[0]]}});
      const r=await fetch(fbRoot(),{method:'PATCH',body:JSON.stringify(body)});
      if(!r.ok)throw new Error(r.status===401||r.status===403?'ditolak Firebase, periksa Rules':'kode '+r.status);
      part.forEach(c=>{if(c[1])delete FS.snap[c[0]];else FS.snap[c[0]]=hs(E[c[0]])});
      saveFS();
    }
    if(ch.length)fbMsg('Terhubung realtime. Terkirim '+fT(Date.now())+' ('+ch.length+' data)');
  }catch(e){
    ok=false;fbMsg('Gagal kirim: '+fbErr(e)+'. Dicoba lagi otomatis.');
    clearTimeout(FBP);FBP=setTimeout(fbPush,8000);
  }
  FBBusy=0;
  if(ok&&FBDirty)fbQueue();
}
const fbUp=(a,v)=>{const i=a.findIndex(x=>x.id===v.id);if(i<0)a.push(v);else a[i]=v};
function fbSet(k,v){
  const t=k.charAt(0),id=k.slice(2);
  if(t==='o'&&v&&v.id){if(v.st==='Terkunci')v.st='Dikonfirmasi';fbUp(S.orders,v);return v}
  if(t==='c'&&v&&v.id){fbUp(S.custs,v);return v}
  if(t==='p'&&v&&v.id){fbUp(S.prods,v);return v}
  if(t==='d'){S.done[id]=v;return v}
  if(t==='q'&&typeof v==='number'){MD()[id]=v;return v}
  if(t==='x'&&id==='set'&&v&&typeof v==='object'){S.set=v;applySet();return v}
  if(t==='x'&&id==='seq'){S.seq=Math.max(S.seq|0,+v||0);return v}
}
function fbDel(k){const t=k.charAt(0),id=k.slice(2);if(t==='o')S.orders=S.orders.filter(x=>x.id!==id);else if(t==='c')S.custs=S.custs.filter(x=>x.id!==id);else if(t==='p')S.prods=S.prods.filter(x=>x.id!==id);else if(t==='d')delete S.done[id];else if(t==='q')delete MD()[id]}
// terapkan data dari online. first = sinkron pertama di HP ini (belum ada catatan sebelumnya)
function fbIn(B,first){
  const ks=Object.keys(B),pr=first&&ks.length>0&&!S.mod;   // pr: HP baru yang masih berisi data contoh, ganti seluruhnya dengan data online
  if(pr){S.orders=[];S.custs=[];S.prods=[];S.done={};S.made={};S.seq=0;FS.snap={}}
  const E=fbEnts();let ch=0,mx=FS.since||0;
  ks.forEach(k=>{
    const r=B[k];if(!r||typeof r.m!=='number'||!/^[ocpdxq]_/.test(k))return;
    const del=r.x?1:0;if(!del&&typeof r.d!=='string')return;
    if(r.m>mx)mx=r.m;
    const has=k in E;let use=true;
    if(has&&!pr){
      if(!del&&E[k]===r.d){FS.snap[k]=hs(r.d);return}
      if(first){if(r.m<=(S.mod||0))use=false}                 // sinkron pertama: yang lebih baru dipakai, data HP ini dikirim nanti
      else if(FS.snap[k]!==hs(E[k]))use=false;                // ada perubahan di HP ini yang belum terkirim: dipertahankan
    }else if(!has&&!pr){
      if(del)return;
      if(!first&&k in FS.snap)use=false;                      // sengaja dihapus di HP ini, belum terkirim
    }
    if(!use)return;
    if(del){fbDel(k);delete FS.snap[k]}
    else{let v;try{v=JSON.parse(r.d)}catch(e){return}const n=fbSet(k,v);if(n===undefined)return;FS.snap[k]=hs(JSON.stringify(n))}
    ch=1;
  });
  if(mx>(FS.since||0))FS.since=mx;
  saveFS();
  if(ch){if(!S.mod)S.mod=Date.now();applySet();persist();schedSoon();render();toast(pr?'Data diambil dari online':first?'Data online digabungkan':'Data diperbarui dari perangkat lain')}
}
function fbStop(){clearTimeout(FBR);clearTimeout(FBP);clearTimeout(FBT);FBReady=0;if(FBS){try{FBS.close()}catch(e){}FBS=null}}
function fbStart(){
  fbStop();
  if(!FBM())return;
  const rk=SY.fbUrl.trim()+'|'+SY.fbRoom.trim();
  if(FS.room!==rk){FS={room:rk,snap:{},since:0};saveFS()}
  fbMsg('Menghubungkan...');
  FBLast=Date.now();
  let R={},pend={},fi=!FS.since,gotInit=0,opened=0,es;
  const url=fbRoot()+(FS.since?'?orderBy=%22m%22&startAt='+FS.since:'');   // hanya ambil yang berubah sejak sinkron terakhir
  try{es=new EventSource(url)}catch(e){return fbMsg('URL database tidak valid.')}
  FBS=es;
  es.onopen=()=>{FBLast=Date.now();opened=1;fbMsg('Terhubung realtime.')};
  const flush=()=>{
    if(FBS!==es)return;
    const X=pend;pend={};
    try{fbIn(X,fi)}catch(e){return fbMsg('Gagal menerapkan data online: '+fbErr(e))}
    fi=false;FBReady=1;fbMsg('Terhubung realtime. Sinkron '+fT(Date.now()));fbQueue();
  };
  const on=(e,patch)=>{
    FBLast=Date.now();
    let m;try{m=JSON.parse(e.data)}catch(x){return}
    const P=String((m&&m.path)||'/').split('/').filter(Boolean),dt=m?m.data:null,B={};
    if(!P.length){
      if(!patch&&!gotInit)R={};
      if(dt&&typeof dt==='object')Object.keys(dt).forEach(k=>{const v=dt[k];if(v&&typeof v==='object'){R[k]=patch&&R[k]?Object.assign({},R[k],v):v;B[k]=R[k]}});
    }else if(P.length===1){
      if(dt&&typeof dt==='object'){R[P[0]]=patch&&R[P[0]]?Object.assign({},R[P[0]],dt):dt;B[P[0]]=R[P[0]]}
    }else if(P.length===2&&dt!=null&&R[P[0]]){
      R[P[0]]=Object.assign({},R[P[0]]);R[P[0]][P[1]]=dt;B[P[0]]=R[P[0]];
    }
    Object.assign(pend,B);
    clearTimeout(FBT);FBT=setTimeout(flush,gotInit?150:0);gotInit=1;
  };
  es.addEventListener('put',e=>on(e,0));
  es.addEventListener('patch',e=>on(e,1));
  es.addEventListener('keep-alive',()=>{FBLast=Date.now()});
  es.addEventListener('cancel',()=>{fbMsg('Ditolak Firebase, periksa Rules database.')});
  es.onerror=()=>{if(FBS!==es)return;fbMsg(opened?'Terputus, mencoba lagi...':'Gagal terhubung. Periksa URL, koneksi, dan Rules terbaru (sudah Publish?). Mencoba lagi...');try{es.close()}catch(e){}FBS=null;FBReady=0;clearTimeout(FBR);FBR=setTimeout(fbStart,5000)};
}
function fbToggle(b){
  if(SY.fbOn){SY.fbOn=0;saveSY();fbStop();fbMsg('Realtime mati.');if(b)b.textContent='Aktifkan realtime';return}
  const u=(SY.fbUrl||'').trim(),k=(SY.fbRoom||'').trim();
  if(!/^https:\/\/[\w.-]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/i.test(u))return fbMsg('URL database tidak valid. Contoh: https://nama-proyek-default-rtdb.firebaseio.com');
  if(!/^[A-Za-z0-9_-]{12,}$/.test(k))return fbMsg('Kode ruang minimal 12 huruf atau angka (tanpa spasi).');
  if(!confirm('Aktifkan realtime?\n\nData online dan data HP digabung: pesanan, pelanggan, dan produk yang hanya ada di satu sisi tetap dipakai; bila berbeda, yang waktu ubahnya lebih baru dipakai. HP baru yang masih berisi data contoh akan langsung diganti data online. Disarankan Backup data dulu.'))return;
  SY.fbOn=1;saveSY();fbStart();if(b)b.textContent='Matikan realtime';
}
function fbKey(){
  const a=new Uint8Array(24);crypto.getRandomValues(a);
  const k=Array.from(a,n=>'abcdefghijklmnopqrstuvwxyz0123456789'[n%36]).join('');
  SY.fbRoom=k;saveSY();const e=$('#fr');if(e)e.value=k;
}

function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.orders)||!Array.isArray(d.custs)||!Array.isArray(d.prods))throw 0;if(!confirm('Ganti semua data sekarang dengan isi backup?'))return;S=mig(d);S.done=S.done||{};S.seq=S.seq||d.orders.length;applySet();save();closeS();render();toast('Data dipulihkan')}catch(e){toast('File backup tidak valid')}};r.readAsText(f)}

const nid=k=>{let h=7;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))|0;return Math.abs(h)%2000000000+1};
